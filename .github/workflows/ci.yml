name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm build --filter=@comma/web

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Check Expo dependencies
        env:
          KAKAO_NATIVE_APP_KEY: 3e627c7aa6795025b12f071d8f752fad
          GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.389558827056-fid949ht18fottu1uv2mkl2odfdn4dr1
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 389558827056-o797ta3s8i4ikukrlm883gsbolscsuhq.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 389558827056-fid949ht18fottu1uv2mkl2odfdn4dr1.apps.googleusercontent.com
        run: pnpm --filter @comma/mobile-shell exec expo install --check
